# gh CLI settings. Auth (accounts, tokens, active account) lives in
# ~/.config/gh/hosts.yml and stays untracked - `gh auth login/switch` owns it.
# This file is an out-of-store symlink, so `gh config set` / `gh alias set`
# write straight into the repo.
version: 1
# Everything else here is ssh (git.nix identities, ssh.nix hosts), so clones
# started by gh should match instead of falling back to https.
git_protocol: ssh
editor:
prompt: enabled
prefer_editor_prompt: disabled
pager:
aliases:
  co: pr checkout
http_unix_socket:
browser:
color_labels: disabled
accessible_colors: disabled
accessible_prompter: disabled
spinner: enabled
