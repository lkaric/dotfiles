# Herdr (https://herdr.dev/docs/configuration/). Empty = defaults.
# Print everything available with `herdr --default-config`.
# Apply edits to a running server: `herdr server reload-config` (or prefix+shift+R).
# Validate with `herdr config check`. Startup-only keys still need a restart.
#
# This file is symlinked out of the nix store, so in-app Settings and
# `herdr config reset-keys` write straight into this repo.

[ui]
# Distinguish agent states by glyph shape, not colour alone.
status_indicators = "symbols"
# Float blocked agents to the top of the sidebar instead of grouping by space.
agent_panel_sort = "priority"

[ui.toast]
# Default is "off": no popup when an agent finishes or needs input.
# "system" asks the OS notification service; "terminal" survives SSH.
delivery = "system"
delay_seconds = 1

[terminal]
# "auto" starts login shells on macOS, which re-runs /usr/libexec/path_helper
# and can reorder PATH ahead of the nix profile.
shell_mode = "non_login"

[worktrees]
directory = "~/git/worktrees"

[theme]
# Follow Ghostty's light/dark appearance reports.
auto_switch = true

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
